<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus Connect</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">

            <div class="logo">CC</div>

            <h1>Campus Connect</h1>

            <p>
                Your campus.
                Your community.
                One place.
            </p>

            <div class="feature-list">

                <div>🛒 Buy & sell campus essentials</div>

                <div>📚 Find serious study partners</div>

                <div>📝 Share notes & study materials</div>

                <div>🤝 Connect with verified peers</div>

            </div>

        </div>


        <div class="auth-card">

            <div class="tabs">

                <button
                    class="tab active"
                    onclick="showLogin()">
                    Login
                </button>

                <button
                    class="tab"
                    onclick="showRegister()">
                    Register
                </button>

            </div>


            <!-- LOGIN -->

            <form id="loginForm">

                <h2>Welcome back 👋</h2>

                <p class="muted">
                    Continue where you left off.
                </p>

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="College email"
                    required>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    required>

                <button class="primary-btn">
                    Login →
                </button>

                <p id="loginMessage"
                   class="form-message"></p>

            </form>


            <!-- REGISTER -->

            <form id="registerForm"
                  style="display:none">

                <h2>Create your account</h2>

                <p class="muted">
                    Join your campus community.
                </p>

                <input
                    id="registerName"
                    type="text"
                    placeholder="Full name"
                    required>

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="College email"
                    required>

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password"
                    required>

                <input
                    id="registerBranch"
                    type="text"
                    placeholder="Branch">

                <input
                    id="registerYear"
                    type="text"
                    placeholder="Year">

                <button class="primary-btn">
                    Create account →
                </button>

                <p id="registerMessage"
                   class="form-message"></p>

            </form>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
